name: Auto Update Worker

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 1 * * *" # 每天凌晨1点运行
  workflow_dispatch:
    inputs:
      force_update:
        description: '是否强制更新（忽略版本检查）'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置环境
        run: |
          echo "REPO_URL=https://api.github.com/repos/bia-pain-bache/BPB-Worker-Panel/releases" >> $GITHUB_ENV
          echo "TARGET_FILE=worker.zip" >> $GITHUB_ENV

      - name: 检查并更新 Worker
        id: check_update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 日志函数
          log() { echo "[$(date +'%Y-%m-%d %H:%M:%S')] $1"; }
          error() { echo "::error::$1"; exit 1; }

          log "开始检查更新..."

          # 获取本地版本
          LOCAL_VERSION=$(cat version.txt 2>/dev/null || echo "")
          log "本地版本: ${LOCAL_VERSION:-无}"

          # 获取最新 Release
          log "获取最新 Release 信息..."
          RESPONSE=$(curl -s --retry 3 --retry-delay 2 \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "$REPO_URL") || error "无法访问 GitHub API"

          # 验证响应
          if [ -z "$RESPONSE" ] || echo "$RESPONSE" | jq -e '.message' > /dev/null 2>&1; then
            error "GitHub API 返回错误或限流"
          fi

          # 提取版本信息
          TAG_NAME=$(echo "$RESPONSE" | jq -r '.[0].tag_name // empty')
          DOWNLOAD_URL=$(echo "$RESPONSE" | jq -r '.[0].assets[] | select(.name == "'"$TARGET_FILE"'") | .browser_download_url // empty')

          if [ -z "$TAG_NAME" ]; then
            error "无法获取最新版本标签"
          fi

          if [ -z "$DOWNLOAD_URL" ]; then
            error "未找到下载文件: $TARGET_FILE"
          fi

          log "最新版本: $TAG_NAME"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

          # 判断是否需要更新
          FORCE_UPDATE='${{ github.event.inputs.force_update }}'
          if [ "$LOCAL_VERSION" = "$TAG_NAME" ] && [ "$FORCE_UPDATE" != "true" ]; then
            log "已是最新版本，无需更新"
            echo "updated=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 下载并更新
          log "下载 $TARGET_FILE..."
          wget -q --timeout=60 --tries=3 -O "$TARGET_FILE" "$DOWNLOAD_URL" || error "下载失败"

          # 验证下载的文件
          if [ ! -f "$TARGET_FILE" ] || [ ! -s "$TARGET_FILE" ]; then
            error "下载的文件无效或为空"
          fi

          log "解压 $TARGET_FILE..."
          unzip -q -o "$TARGET_FILE" || error "解压失败"

          # 清理临时文件
          rm -f "$TARGET_FILE"

          # 更新版本文件
          echo "$TAG_NAME" > version.txt

          log "更新完成，新版本: $TAG_NAME"
          echo "updated=true" >> $GITHUB_OUTPUT

      - name: 提交更改
        if: steps.check_update.outputs.updated == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 自动同步 Worker 版本: ${{ steps.check_update.outputs.tag_name }}"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          skip_dirty_check: false
